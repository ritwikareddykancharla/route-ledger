<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="rl-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0e1a2b"/>
    </marker>
    <marker id="rl-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6433"/>
    </marker>
  </defs>
  <rect width="1120" height="480" fill="#f2f5fa"/>
  <rect x="16" y="16" width="1088" height="448" fill="#ffffff" stroke="#0e1a2b" stroke-width="1.5"/>

  <rect x="40" y="38" width="205" height="22" fill="#12737a"/>
  <text x="142" y="53" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#ffffff" letter-spacing="1.2">ROUTELEDGER ARCHITECTURE</text>
  <text x="40" y="86" font-size="21" font-weight="800" fill="#0e1a2b">AWS CloudFront + Multi-Path Graph Solver + ACID Double-Entry Ledger</text>
  <text x="40" y="106" font-family="monospace" font-size="11.5" fill="#6b7a92">Private S3 OAC SigV4 · Lambda /api/* (us-west-2) · SQLite BEGIN IMMEDIATE · Amazon Bedrock (us.amazon.nova-lite-v1:0)</text>

  <!-- CloudFront -->
  <rect x="40" y="148" width="205" height="250" fill="#ffffff" stroke="#35527e" stroke-width="2"/>
  <text x="142" y="174" text-anchor="middle" font-family="monospace" font-size="10" fill="#35527e">GLOBAL EDGE CDN</text>
  <text x="142" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#0e1a2b">Amazon CloudFront</text>
  <rect x="56" y="216" width="173" height="72" fill="#f2f5fa" stroke="#0e1a2b" stroke-width="1"/>
  <text x="142" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e1a2b">Behavior 1: Default (*)</text>
  <text x="142" y="256" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0c8a4d">Private S3 via OAC SigV4</text>
  <text x="142" y="272" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b7a92">BlockPublicAccess = TRUE</text>

  <rect x="56" y="302" width="173" height="78" fill="#f2f5fa" stroke="#0e1a2b" stroke-width="1"/>
  <text x="142" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e1a2b">Behavior 2: /api/*</text>
  <text x="142" y="342" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#12737a">routeledger-api-origin</text>
  <text x="142" y="358" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b7a92">CachingDisabled · No-Store</text>

  <!-- Mode 1 & Mode 2 Router -->
  <rect x="295" y="148" width="245" height="114" fill="#0e1a2b" stroke="#0e1a2b" stroke-width="1.5"/>
  <text x="417" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#8fb0e6">28-NODE / 120-LINK SOLVER</text>
  <text x="417" y="194" text-anchor="middle" font-size="15.5" font-weight="800" fill="#ffffff">Min-Cost &amp; SNR Router</text>
  <text x="417" y="216" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#d6e0f5">526.5ms -&gt; 132.8ms p99 (-74.8%)</text>
  <text x="417" y="236" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#4fd19a">0.465ms p99 · 35.67%-&gt;1.67% SLA</text>

  <!-- Double-Entry Ledger -->
  <rect x="295" y="284" width="245" height="114" fill="#ffffff" stroke="#35527e" stroke-width="2"/>
  <text x="417" y="308" text-anchor="middle" font-family="monospace" font-size="10" fill="#35527e">ACID SETTLEMENT ENGINE</text>
  <text x="417" y="330" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0e1a2b">Double-Entry SQLite</text>
  <text x="417" y="352" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#33425a">SHA-256 5x SQS Retry Dedup</text>
  <text x="417" y="370" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0c8a4d">0 Dupes · SUM(Dr)==SUM(Cr)</text>

  <!-- NOC Workflow -->
  <rect x="590" y="148" width="215" height="114" fill="#ffffff" stroke="#35527e" stroke-width="2"/>
  <text x="697" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#35527e">NOC &amp; FLOOR TRIAGE</text>
  <text x="697" y="194" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0e1a2b">&le;3-Check Decision Trees</text>
  <text x="697" y="216" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#33425a">100.0% Root-Cause Accuracy</text>
  <text x="697" y="236" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0c8a4d">2.41 Mean Steps (-93.5%)</text>

  <!-- Multi-Region Tax & Recon -->
  <rect x="590" y="284" width="215" height="114" fill="#ffffff" stroke="#0e1a2b" stroke-width="1.5"/>
  <text x="697" y="308" text-anchor="middle" font-family="monospace" font-size="10" fill="#12737a">EXACT DECIMAL RECON</text>
  <text x="697" y="330" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0e1a2b">Tax &amp; OOO Watermarks</text>
  <text x="697" y="352" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#33425a">US-WA · DE · JP · BR Rules</text>
  <text x="697" y="370" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0c8a4d">32,704.9 ev/sec · 0c Drift</text>

  <!-- Bedrock -->
  <rect x="855" y="185" width="225" height="168" fill="#12737a" stroke="#0e1a2b" stroke-width="1.5"/>
  <text x="967" y="214" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ccfbf1">AMAZON BEDROCK (US-WEST-2)</text>
  <text x="967" y="240" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">nova-lite-v1:0</text>
  <text x="967" y="266" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ffffff">• SNR-Threshold Link Triage</text>
  <text x="967" y="288" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ffffff">• Freight Corridor Dispatch</text>
  <text x="967" y="308" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ffffff">• Grounded Telemetry Brief</text>

  <!-- Arrows -->
  <path d="M245 215L293 205" stroke="#0e1a2b" stroke-width="1.8" fill="none" marker-end="url(#rl-ink)"/>
  <path d="M245 340L293 340" stroke="#0e1a2b" stroke-width="1.8" fill="none" marker-end="url(#rl-ink)"/>
  <path d="M540 205H588" stroke="#0e1a2b" stroke-width="1.8" fill="none" marker-end="url(#rl-ink)"/>
  <path d="M540 340H588" stroke="#0e1a2b" stroke-width="1.8" fill="none" marker-end="url(#rl-ink)"/>
  <path d="M805 205L853 250" stroke="#ff6433" stroke-width="1.8" stroke-dasharray="5 5" fill="none" marker-end="url(#rl-sig)"/>
</svg>
