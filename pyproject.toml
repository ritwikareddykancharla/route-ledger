[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "route-ledger"
version = "2.0.0"
description = "Multi-modal ATROPS Pareto router, multi-item split-box optimizer, LEO 5-subsystem MCP diagnostics, JPL Power-of-10 static C++ gate, and ACID double-entry ledger"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ritwika Kancharla" }
]
keywords = [
    "distributed-systems",
    "network-routing",
    "leo-satellite",
    "supply-chain-optimization",
    "double-entry-ledger",
    "idempotency",
    "noc-automation",
    "aws-lambda"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
route-ledger = "route_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["route_ledger*"]
